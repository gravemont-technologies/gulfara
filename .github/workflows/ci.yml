name: CI — Build & Security

on:
  pull_request:
    branches: [main, feat/botaqi-deploy]
  push:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: botaqi-web/package-lock.json
      
      - name: Install dependencies (deterministic)
        run: |
          cd botaqi-web
          npm ci
      
      - name: TypeScript type-check
        run: |
          cd botaqi-web
          npx tsc --noEmit
      
      - name: ESLint
        run: |
          cd botaqi-web
          npm run lint
      
      - name: Build production bundle
        run: |
          cd botaqi-web
          npm run build
  
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Scan for hardcoded secrets
        run: |
          # Fail if any suspicious patterns detected
          if git log -p --all | grep -iE '(OPENAI_API_KEY|FIREBASE_ADMIN_KEY|-----BEGIN.*PRIVATE.*KEY|password\s*=\s*[A-Za-z0-9]{8,})' > /dev/null; then
            echo "❌ Secret patterns detected in git history"
            exit 1
          fi
          
          if git diff HEAD~1 HEAD | grep -iE '(OPENAI_API_KEY|FIREBASE_ADMIN_KEY)' > /dev/null; then
            echo "❌ Secret pattern in latest commit"
            exit 1
          fi
          
          echo "✅ No secrets detected"
