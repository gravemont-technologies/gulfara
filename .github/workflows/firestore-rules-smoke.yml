name: Firestore Rules Smoke

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'scripts/**'
      - 'functions/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Start Firestore emulator
        run: |
          npx firebase emulators:start --only firestore --project gulfara-cards &
          # wait for port 8080 to be open
          for i in {1..30}; do
            nc -z localhost 8080 && break || sleep 1
          done

      - name: Run rules smoke-test (PowerShell)
        run: pwsh -NoProfile -File ./scripts/firestore-rules-smoke.ps1
